<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>❤️ Todo mi amor ❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 30%, #cc0000, #8b0000);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            padding: 80px 16px 30px;
            overflow-x: hidden;
            position: relative;
        }
        .volver {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 10px 22px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volver:hover { background: rgba(255,255,255,0.25); transform: scale(1.05); }
        .love-card {
            background: rgba(180, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 60px 60px 40px 40px;
            padding: 30px 24px 40px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,200,200,0.3);
            border: 1px solid rgba(255,100,100,0.5);
            text-align: center;
            position: relative;
            z-index: 10;
            animation: cardPulse 3s infinite alternate;
        }
        @keyframes cardPulse {
            0% { box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,150,150,0.3); }
            100% { box-shadow: 0 25px 50px rgba(200,0,0,0.8), 0 0 0 4px rgba(255,100,100,0.6); }
        }
        h1 {
            color: #fff5e6;
            font-size: 3.2rem;
            font-weight: 700;
            text-shadow: 0 0 15px #ff4d4d, 0 0 30px #ff1a1a, 0 4px 8px rgba(0,0,0,0.6);
            animation: pulseText 1.8s infinite ease-in-out;
        }
        @keyframes pulseText {
            0% { transform: scale(1); text-shadow: 0 0 15px #ff4d4d, 0 0 30px #ff1a1a; }
            50% { transform: scale(1.05); text-shadow: 0 0 25px #ff8080, 0 0 55px #ff3333, 0 0 80px #ff0000; }
            100% { transform: scale(1); text-shadow: 0 0 15px #ff4d4d, 0 0 30px #ff1a1a; }
        }
        .sub-message {
            font-size: 1.9rem;
            font-weight: 600;
            color: #ffe6cc;
            text-shadow: 0 0 12px #ff6666;
            background: rgba(200,0,0,0.3);
            padding: 10px 12px;
            border-radius: 80px;
            display: inline-block;
            animation: floatMessage 3s infinite alternate;
        }
        @keyframes floatMessage {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(-6px) scale(1.02); }
        }
        .big-love {
            font-size: 3.6rem;
            font-weight: 800;
            color: #ffd9b3;
            text-shadow: 0 0 20px #ff6666, 0 0 40px #ff0000, 0 0 70px #cc0000;
            animation: glowPulse 2.2s infinite alternate;
        }
        @keyframes glowPulse {
            0% { text-shadow: 0 0 15px #ff4d4d, 0 0 30px #ff1a1a; }
            100% { text-shadow: 0 0 30px #ff9999, 0 0 60px #ff3333, 0 0 90px #ff0000; }
        }
        .deco-hearts {
            font-size: 2.8rem;
            letter-spacing: 12px;
            color: #ffcccc;
            text-shadow: 0 0 20px #ff3333, 0 0 40px #cc0000;
            animation: spinHeart 8s infinite linear;
            display: inline-block;
        }
        @keyframes spinHeart {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(10deg) scale(1.1); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .extra-love {
            font-size: 1.8rem;
            color: #ffe0cc;
            background: rgba(130,0,0,0.3);
            padding: 12px 18px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            border: 1px solid #ff6666;
            display: inline-block;
            box-shadow: 0 0 20px rgba(255,0,0,0.3);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { box-shadow: 0 0 10px #ff4d4d; }
            50% { box-shadow: 0 0 30px #ff1a1a, 0 0 60px #ff0000; }
            100% { box-shadow: 0 0 10px #ff4d4d; }
        }
        .touch-love {
            margin-top: 30px;
            background: #ff4d4d;
            border: none;
            border-radius: 80px;
            padding: 16px 28px;
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff0e0;
            text-shadow: 0 0 10px #990000;
            box-shadow: 0 8px 0 #880000, 0 12px 30px rgba(0,0,0,0.5);
            transition: all 0.08s ease;
            width: 100%;
            max-width: 300px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .touch-love:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #660000, 0 8px 20px rgba(0,0,0,0.6);
        }
        .heart-float {
            position: fixed;
            font-size: 2.4rem;
            animation: floatUp linear infinite;
            opacity: 0.9;
            text-shadow: 0 0 10px #ff8888, 0 0 25px #ff3333;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.4) rotate(0deg); opacity: 0.3; }
            15% { opacity: 0.9; }
            85% { opacity: 0.9; }
            100% { transform: translateY(-10vh) scale(1.2) rotate(720deg); opacity: 0.2; }
        }
        @media (max-width: 420px) {
            h1 { font-size: 2.8rem; }
            .sub-message { font-size: 1.6rem; }
            .big-love { font-size: 3rem; }
            .extra-love { font-size: 1.4rem; }
            .touch-love { font-size: 1.5rem; padding: 14px 20px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="volver">← Volver al inicio</a>

    <div id="heartsContainer"></div>

    <div class="love-card">
        <div class="deco-hearts">❤️ ❤️ ❤️</div>
        <h1>MI OJITOS</h1>
        <div class="sub-message">✨ mi vida ✨</div>
        <div class="big-love">❤️ TE QUIERO ❤️</div>
        <div class="extra-love">💖 MI NIÑA ANTARA 💖</div>
        <div style="font-size:2.8rem; margin:10px 0; letter-spacing:6px; color:#ffd9b3; text-shadow:0 0 20px #ff4d4d;">🌹💋🌹</div>
        <button class="touch-love" id="loveButton">💕 TOCA AMOR 💕</button>
        <div style="margin-top:16px; font-size:1.2rem; color:#ffcccc; opacity:0.9;">❤️ siempre contigo ❤️</div>
    </div>

    <script>
        (function() {
            "use strict";
            const container = document.getElementById('heartsContainer');
            if (!container) return;
            const symbols = ['❤️','💖','💕','💗','♥️','❤️‍🔥','💘','💝'];

            function createFloatingHeart() {
                const heart = document.createElement('div');
                heart.className = 'heart-float';
                heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                const size = 1.4 + Math.random() * 2.2;
                heart.style.fontSize = size + 'rem';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDuration = (12 + Math.random() * 14) + 's';
                heart.style.animationDelay = (Math.random() * 12) + 's';
                heart.style.opacity = 0.6 + Math.random() * 0.4;
                container.appendChild(heart);
                setTimeout(function() { if (heart.parentNode) heart.remove(); }, 28000);
            }

            for (var i = 0; i < 28; i++) createFloatingHeart();
            setInterval(createFloatingHeart, 4000);

            function addExtraHeart() {
                const heart = document.createElement('div');
                heart.className = 'heart-float';
                const extraSymbols = ['❤️','💖','💕','💗','♥️','💘','💝','❤️‍🔥'];
                heart.textContent = extraSymbols[Math.floor(Math.random() * extraSymbols.length)];
                heart.style.fontSize = (2.0 + Math.random() * 2.8) + 'rem';
                heart.style.left = (10 + Math.random() * 80) + '%';
                heart.style.animationDuration = (12 + Math.random() * 16) + 's';
                heart.style.animationDelay = '0s';
                heart.style.opacity = 0.9;
                container.appendChild(heart);
                setTimeout(function() { if (heart.parentNode) heart.remove(); }, 28000);
            }

            const loveBtn = document.getElementById('loveButton');
            if (loveBtn) {
                loveBtn.addEventListener('click', function() {
                    if (navigator.vibrate) navigator.vibrate(30);
                    for (var i = 0; i < 8; i++) {
                        setTimeout(addExtraHeart, i * 120);
                    }
                    const originalText = loveBtn.textContent;
                    loveBtn.textContent = '💗 TE QUIERO 💗';
                    loveBtn.style.transform = 'scale(0.95)';
                    setTimeout(function() {
                        loveBtn.textContent = originalText;
                        loveBtn.style.transform = '';
                    }, 800);
                    const floatMsg = document.createElement('div');
                    floatMsg.textContent = '❤️ MI NIÑA ANTARA ❤️';
                    Object.assign(floatMsg.style, {
                        position: 'fixed', bottom: '30%', left: '50%',
                        transform: 'translateX(-50%) scale(0.5)',
                        fontSize: '2.8rem', fontWeight: 'bold',
                        color: '#fff5e6', textShadow: '0 0 40px #ff3333, 0 0 80px #cc0000',
                        background: 'rgba(150,0,0,0.6)', padding: '18px 28px',
                        borderRadius: '80px', backdropFilter: 'blur(6px)',
                        border: '2px solid #ff8888', zIndex: '999', pointerEvents: 'none',
                        transition: 'all 0.3s cubic-bezier(0.2,0.9,0.4,1.2)',
                        opacity: '0'
                    });
                    document.body.appendChild(floatMsg);
                    requestAnimationFrame(function() {
                        floatMsg.style.opacity = '1';
                        floatMsg.style.transform = 'translateX(-50%) scale(1)';
                        floatMsg.style.bottom = '45%';
                    });
                    setTimeout(function() {
                        floatMsg.style.opacity = '0';
                        floatMsg.style.transform = 'translateX(-50%) scale(0.8)';
                        setTimeout(function() { if (floatMsg.parentNode) floatMsg.remove(); }, 400);
                    }, 2200);
                });
            }
        })();
    </script>
</body>
</html>
