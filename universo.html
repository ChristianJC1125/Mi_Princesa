<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestro Universo ❤️</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0015;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        #universo {
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }
        .volver {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            padding: 12px 25px;
            color: white;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volver:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
        .mensaje-universo {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            color: rgba(255,255,255,0.5);
            font-size: 0.9rem;
            background: rgba(0,0,0,0.4);
            padding: 10px 25px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            text-align: center;
            pointer-events: none;
        }
        @media (max-width: 600px) {
            .volver { padding: 10px 18px; font-size: 0.8rem; }
            .mensaje-universo { font-size: 0.7rem; padding: 8px 16px; bottom: 15px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="volver">← Volver al inicio</a>
    <div id="universo"></div>
    <div class="mensaje-universo">✨ Toca las estrellas brillantes ✨</div>

    <script>
        (function() {
            const contenedor = document.getElementById('universo');
            if (!contenedor) return;
            if (typeof THREE === 'undefined') {
                contenedor.innerHTML = '<div style="color:white;text-align:center;padding:40px;">Cargando universo...</div>';
                return;
            }

            const escena = new THREE.Scene();
            escena.background = new THREE.Color(0x0a0015);

            const camara = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camara.position.set(0, 0, 25);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            contenedor.appendChild(renderer.domElement);

            // Estrellas de fondo
            const starCount = 2500;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                const r = 50 + Math.random() * 400;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos(2 * Math.random() - 1);
                pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
                pos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                pos[i * 3 + 2] = r * Math.cos(phi);
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true, opacity: 0.8 });
            const stars = new THREE.Points(geo, mat);
            escena.add(stars);

            const mensajes = [
                { titulo: "✨ Estrella 1", texto: "Eres mi persona favorita." },
                { titulo: "✨ Estrella 2", texto: "Siempre brillas más que el sol." },
                { titulo: "✨ Estrella 3", texto: "Contigo el universo tiene sentido." },
                { titulo: "✨ Estrella 4", texto: "Te quiero hasta el infinito." },
                { titulo: "✨ Estrella 5", texto: "Eres mi hogar." }
            ];

            const grupo = new THREE.Group();
            escena.add(grupo);
            const interactivas = [];

            mensajes.forEach(function(msg, i) {
                const angulo = (i / mensajes.length) * Math.PI * 2;
                const radio = 6 + Math.random() * 3;
                const x = Math.cos(angulo) * radio;
                const y = Math.sin(angulo * 0.8) * 3;
                const z = Math.sin(angulo) * radio * 0.5;
                const esfera = new THREE.Mesh(
                    new THREE.SphereGeometry(0.5, 16, 16),
                    new THREE.MeshBasicMaterial({ color: 0xff7fbf })
                );
                esfera.position.set(x, y, z);
                esfera.userData = { mensaje: msg };
                grupo.add(esfera);
                interactivas.push(esfera);

                const glow = new THREE.Mesh(
                    new THREE.SphereGeometry(0.9, 8, 8),
                    new THREE.MeshBasicMaterial({ color: 0xff7fbf, transparent: true, opacity: 0.15 })
                );
                glow.position.copy(esfera.position);
                grupo.add(glow);
            });

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            function onClick(event) {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(mouse, camara);
                const intersects = raycaster.intersectObjects(interactivas);
                if (intersects.length > 0) {
                    const obj = intersects[0].object;
                    const msg = obj.userData.mensaje;
                    alert('💫 ' + msg.titulo + '\n' + msg.texto);
                }
            }

            renderer.domElement.addEventListener('click', onClick);
            renderer.domElement.addEventListener('touchstart', function(e) {
                if (e.touches.length === 1) {
                    const touch = e.touches[0];
                    onClick({ clientX: touch.clientX, clientY: touch.clientY });
                }
            }, { passive: true });

            function animar() {
                requestAnimationFrame(animar);
                grupo.rotation.y += 0.003;
                stars.rotation.y += 0.0003;
                renderer.render(escena, camara);
            }
            animar();

            window.addEventListener('resize', function() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                camara.aspect = w / h;
                camara.updateProjectionMatrix();
                renderer.setSize(w, h);
            });
        })();
    </script>
</body>
</html>
