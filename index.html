<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snoopy · Mensajes de Amor ❤️</title>
  <style>
    /* RESET & BASE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
      /* Fondo: imagen de Snoopy (caricatura) */
      background-image: url('https://i.pinimg.com/736x/1b/12/2f/1b122f0f1ce6d5bbcc86e70352d69362.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      /* Superposición roja translúcida para dar calidez y legibilidad */
      position: relative;
    }

    /* Capa roja con blend para que se vea la imagen y el rojo */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-color: rgba(200, 40, 40, 0.35); /* rojo intenso con opacidad */
      backdrop-filter: brightness(1.1) saturate(1.2);
      z-index: 0;
      pointer-events: none;
    }

    /* Contenedor principal */
    .container {
      position: relative;
      z-index: 10;
      max-width: 780px;
      width: 90%;
      margin: 2rem auto;
      padding: 2.5rem 2rem;
      background: rgba(255, 240, 240, 0.2);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 60px 20px 60px 20px;
      box-shadow: 0 20px 40px rgba(180, 20, 20, 0.5), 0 0 0 2px rgba(255, 80, 80, 0.3);
      border: 1px solid rgba(255, 200, 200, 0.6);
      transition: all 0.3s ease;
      text-align: center;
    }

    /* Título con corazón */
    .title {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff0e6;
      text-shadow: 0 4px 12px #a00, 0 0 20px #f44, 2px 2px 0 #5a0000;
      letter-spacing: 2px;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .title span {
      background: rgba(200, 30, 30, 0.5);
      backdrop-filter: blur(4px);
      padding: 0.2rem 1rem;
      border-radius: 60px;
      border: 1px solid #ff8888;
    }

    /* Caja del mensaje */
    .message-box {
      background: rgba(190, 30, 30, 0.25);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      padding: 1.8rem 1.2rem;
      margin: 1.8rem 0;
      border-radius: 80px 20px 80px 20px;
      border: 2px solid #ffa0a0;
      box-shadow: inset 0 0 30px rgba(255, 80, 80, 0.3), 0 12px 20px rgba(100, 0, 0, 0.4);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #mensaje {
      font-size: 1.9rem;
      font-weight: 600;
      color: #fff5f0;
      text-shadow: 0 0 15px #ff5555, 0 2px 4px #4a0000;
      line-height: 1.4;
      word-break: break-word;
      letter-spacing: 0.5px;
      font-family: 'Segoe UI', 'Quicksand', cursive;
      transition: transform 0.3s ease;
    }
    /* pequeño detalle de snoopy (emoji) */
    #mensaje::before {
      content: "🐾 ";
      font-size: 2rem;
      filter: drop-shadow(0 0 6px #f88);
    }
    #mensaje::after {
      content: " 🐾";
      font-size: 2rem;
      filter: drop-shadow(0 0 6px #f88);
    }

    /* Grupo de botones bonitos con movimiento */
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem 1.5rem;
      margin-top: 2.2rem;
      margin-bottom: 0.8rem;
    }

    .btn {
      background: #cc2222;
      border: none;
      border-radius: 80px 20px 80px 20px;
      padding: 0.9rem 2rem;
      font-size: 1.3rem;
      font-weight: 700;
      color: white;
      text-shadow: 0 2px 6px #3f0000;
      box-shadow: 0 8px 0 #7a1515, 0 10px 25px rgba(150, 0, 0, 0.6);
      cursor: pointer;
      transition: all 0.15s ease-in-out;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid #ff7a7a;
      letter-spacing: 1px;
      transform: translateY(0);
      backdrop-filter: blur(4px);
      background: linear-gradient(145deg, #e63c3c, #b31b1b);
      flex: 0 1 auto;
      min-width: 140px;
    }

    /* Botón con movimiento (hover y active) */
    .btn:hover {
      transform: translateY(-6px) scale(1.02);
      box-shadow: 0 12px 0 #6b0f0f, 0 20px 35px rgba(200, 0, 0, 0.7);
      background: linear-gradient(145deg, #ff4f4f, #cc2222);
      border-color: #ffb0b0;
    }

    .btn:active {
      transform: translateY(4px) scale(0.98);
      box-shadow: 0 4px 0 #6b0f0f, 0 8px 20px rgba(150, 0, 0, 0.6);
      transition-duration: 0.05s;
    }

    /* Botón especial "Nuevo mensaje" con destello */
    .btn-primary {
      background: linear-gradient(145deg, #ff3a3a, #b01010);
      box-shadow: 0 8px 0 #6f0e0e, 0 0 20px #ff3333;
      border: 1px solid #ff8888;
      font-size: 1.4rem;
      padding: 0.9rem 2.4rem;
    }
    .btn-primary:hover {
      box-shadow: 0 12px 0 #5f0a0a, 0 0 35px #ff5555, 0 0 60px #ff2222;
    }

    /* Botón de "Snoopy dice" con icono */
    .btn-snoopy {
      background: linear-gradient(145deg, #d43b3b, #9e1a1a);
      box-shadow: 0 8px 0 #631212, 0 8px 20px #a00;
    }

    /* Footer con corazón */
    .footer-note {
      margin-top: 2rem;
      color: #ffdddd;
      font-size: 1.1rem;
      font-weight: 500;
      text-shadow: 0 2px 10px #a00, 0 0 20px #f55;
      background: rgba(100, 10, 10, 0.3);
      backdrop-filter: blur(4px);
      padding: 0.6rem 1.2rem;
      border-radius: 60px;
      display: inline-block;
      border: 1px solid #ff9a9a;
      letter-spacing: 1px;
    }

    /* Responsive */
    @media (max-width: 550px) {
      .container {
        padding: 1.8rem 1rem;
        border-radius: 40px 10px 40px 10px;
      }
      .title {
        font-size: 1.6rem;
      }
      #mensaje {
        font-size: 1.4rem;
      }
      .btn {
        font-size: 1.1rem;
        padding: 0.7rem 1.2rem;
        min-width: 120px;
      }
      .btn-group {
        gap: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Título con Snoopy y corazón -->
    <div class="title">
      <span>❤️ SNOOPY · AMOR ❤️</span>
    </div>

    <!-- Caja de mensaje -->
    <div class="message-box">
      <div id="mensaje">Eres mi gran felicidad</div>
    </div>

    <!-- Botones con movimiento y estilo rojo -->
    <div class="btn-group">
      <button class="btn btn-primary" id="btnNuevo">✨ Nuevo mensaje</button>
      <button class="btn btn-snoopy" id="btnSnoopy">🐶 Snoopy dice</button>
    </div>
    <div class="btn-group" style="margin-top: 0.5rem;">
      <button class="btn" id="btnAmor">❤️‍🔥 Te quiero</button>
      <button class="btn" id="btnAbrazo">🤗 Abrazo gigante</button>
    </div>

    <!-- pie de página bonito -->
    <div class="footer-note">
      🐾 siempre contigo · Snoopy & amor 🐾
    </div>
  </div>

  <script>
    (function() {
      // Lista de mensajes bonitos de amor (con estilo Snoopy)
      const mensajesAmor = [
        "Eres mi persona favorita en el mundo",
        "Contigo todo es mejor, hasta los lunes",
        "Tu sonrisa ilumina mi corazón",
        "Snoopy y yo sabemos que eres especial",
        "Eres el Charlie Brown de mi vida 💛",
        "Cada día a tu lado es un regalo",
        "Te quiero más que Snoopy a su comida",
        "Eres mi hogar, mi paz, mi todo",
        "Snoopy aprueba este amor ❤️",
        "Eres el sol de mis mañanas",
        "Tu amor me hace bailar de felicidad",
        "Eres mi mejor historia de amor",
        "Siempre serás mi persona favorita",
        "Te amo con todo mi corazón de algodón",
        "Eres mi sueño hecho realidad",
        "Gracias por existir, te quiero",
        "Snoopy dice: ¡ella/él es increíble!",
        "Eres la razón de mi sonrisa",
        "Tu amor es mi lugar seguro",
        "Eres mi todo, siempre 💕"
      ];

      // Elementos
      const mensajeEl = document.getElementById('mensaje');
      const btnNuevo = document.getElementById('btnNuevo');
      const btnSnoopy = document.getElementById('btnSnoopy');
      const btnAmor = document.getElementById('btnAmor');
      const btnAbrazo = document.getElementById('btnAbrazo');

      // Función para cambiar mensaje con animación sutil
      function cambiarMensaje(texto) {
        if (!texto) return;
        // efecto rápido de escala
        mensajeEl.style.transform = 'scale(0.92)';
        setTimeout(() => {
          mensajeEl.textContent = texto;
          mensajeEl.style.transform = 'scale(1)';
        }, 120);
      }

      // Mensaje aleatorio de la lista
      function mensajeAleatorio() {
        const randomIndex = Math.floor(Math.random() * mensajesAmor.length);
        return mensajesAmor[randomIndex];
      }

      // Asignar eventos a los botones
      btnNuevo.addEventListener('click', function() {
        const nuevo = mensajeAleatorio();
        cambiarMensaje(nuevo);
        // feedback táctil (opcional)
        this.blur();
      });

      btnSnoopy.addEventListener('click', function() {
        const snoopyMsg = [
          "🐶 ¡Snoopy te ama! woof woof ❤️",
          "Snoopy dice: eres un sol ☀️",
          "🐾 Snoopy aprueba este mensaje",
          "Snoopy y Woodstock te mandan besos",
          "¡Snoopy está feliz por ti! 🐕",
          "Snoopy cree que eres genial",
          "Woof! Eres la persona favorita de Snoopy",
        ];
        const randomSnoopy = snoopyMsg[Math.floor(Math.random() * snoopyMsg.length)];
        cambiarMensaje(randomSnoopy);
        this.blur();
      });

      btnAmor.addEventListener('click', function() {
        const loveMsg = [
          "❤️ Te quiero con toda mi alma",
          "Eres el amor de mi vida ❤️‍🔥",
          "Cada latido es para ti 💓",
          "Mi corazón es tuyo, siempre",
          "Eres mi media naranja 🍊❤️",
          "Te amo más que ayer, menos que mañana",
          "Eres mi sueño, mi realidad, mi amor"
        ];
        const randomLove = loveMsg[Math.floor(Math.random() * loveMsg.length)];
        cambiarMensaje(randomLove);
        this.blur();
      });

      btnAbrazo.addEventListener('click', function() {
        const abrazos = [
          "🤗 Un abrazo gigante para ti",
          "Abrazo de oso (y de Snoopy) 🐻",
          "🤗 Abrazo que cura el alma",
          "Te mando un abrazo enorme y cálido",
          "Abrazo de 10 segundos 🤗",
          "Snoopy te envía un abrazo de peluche",
          "El mejor abrazo del mundo para ti"
        ];
        const randomAbrazo = abrazos[Math.floor(Math.random() * abrazos.length)];
        cambiarMensaje(randomAbrazo);
        this.blur();
      });

      // Al cargar, mostrar un mensaje aleatorio
      window.addEventListener('load', function() {
        const inicial = mensajeAleatorio();
        mensajeEl.textContent = inicial;
      });

      // Efecto extra: cada 15 segundos cambia automáticamente (como un detalle)
      let intervalId = setInterval(() => {
        const nuevo = mensajeAleatorio();
        cambiarMensaje(nuevo);
      }, 17000);

      // Si el usuario hace clic en cualquier botón, reiniciamos el intervalo para que no se solape
      const todosLosBotones = [btnNuevo, btnSnoopy, btnAmor, btnAbrazo];
      todosLosBotones.forEach(btn => {
        btn.addEventListener('click', function() {
          // Reiniciar el intervalo para evitar cambios inmediatos
          clearInterval(intervalId);
          intervalId = setInterval(() => {
            const nuevo = mensajeAleatorio();
            cambiarMensaje(nuevo);
          }, 17000);
        });
      });

    })();
  </script>
</body>
</html>
