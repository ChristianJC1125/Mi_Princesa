<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌷 Para hacerte sonreír</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at center, #ffe6e6, #fff5f5 60%, #fff);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Georgia, 'Times New Roman', serif;
            padding: 80px 20px 40px;
            color: #4a1a1a;
            text-align: center;
        }
        .volver {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(200,50,50,0.2);
            border-radius: 50px;
            padding: 10px 22px;
            color: #4a1a1a;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .volver:hover { background: white; transform: scale(1.05); }
        .container { max-width: 800px; width: 100%; }
        .section-title {
            font-size: clamp(2.6rem, 7vw, 4.5rem);
            color: #cc2233;
            margin-bottom: 20px;
        }
        .final-heart {
            font-size: clamp(120px, 22vw, 200px);
            animation: heartbeat 1.6s infinite;
            filter: drop-shadow(0 20px 40px rgba(200,30,30,0.2));
        }
        @keyframes heartbeat {
            0%,100% { transform: scale(1); }
            14% { transform: scale(1.25); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
        }
        .mensaje-box {
            margin: 30px auto;
            font-size: 1.3rem;
            line-height: 2.2;
            color: #4a1a1a;
            background: rgba(255,255,255,0.5);
            padding: 25px 30px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(200,50,50,0.06);
            max-width: 750px;
        }
        .btn-sonrisa {
            border: none;
            padding: 18px 44px;
            border-radius: 60px;
            background: linear-gradient(145deg, #d62839, #ff4d6a);
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 12px 35px rgba(200,30,30,0.3);
            transition: 0.3s;
            letter-spacing: 0.5px;
            font-weight: 500;
            margin-top: 10px;
        }
        .btn-sonrisa:hover { transform: translateY(-6px) scale(1.03); }
        .frases-container {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .frase-item {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(2px);
            padding: 16px 20px;
            border-radius: 30px;
            font-size: 1.1rem;
            color: #4a1a1a;
            border: 1px solid rgba(200,50,50,0.08);
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .signature {
            margin-top: 40px;
            color: #cc2233;
            font-style: italic;
            font-size: 1.2rem;
        }
        @media (max-width: 750px) {
            .section-title { font-size: 2.5rem; }
            .mensaje-box { font-size: 1rem; padding: 18px 20px; }
            .frase-item { font-size: 1rem; padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="volver">← Volver al inicio</a>

    <div class="container">
        <div class="final-heart">💗</div>
        <h1 class="section-title">Para hacerte sonreír</h1>
        <p class="mensaje-box">Porque tu sonrisa es una de las cosas más bonitas que existen.</p>

        <button class="btn-sonrisa" id="btnSonrisa">💫 Dame una frase bonita</button>

        <div class="frases-container" id="frasesContainer"></div>

        <div class="signature">Siempre para ti, con amor ❤️</div>
    </div>

    <script>
        const frases = [
            "Eres la persona más hermosa que conozco, por dentro y por fuera. ❤️",
            "Tu sonrisa ilumina incluso los días más grises. ✨",
            "Eres más fuerte de lo que crees, y más valiosa de lo que imaginas. 🌟",
            "Cada día que pasa, me das más razones para quererte. 💖",
            "No necesitas ser perfecta, porque tal como eres, eres increíble. 🌷",
            "Eres mi lugar favorito en todo el mundo. 🫂",
            "Tu risa es mi canción favorita. 🎵",
            "Eres el mejor regalo que la vida me ha dado. 🎁",
            "Nunca olvides lo especial que eres para mí. 💕",
            "Eres mi persona favorita. Siempre. 💗"
        ];

        let indiceActual = 0;
        const container = document.getElementById('frasesContainer');
        const btn = document.getElementById('btnSonrisa');

        function mostrarFrase() {
            const frase = frases[indiceActual % frases.length];
            const div = document.createElement('div');
            div.className = 'frase-item';
            div.textContent = '💫 ' + frase;
            container.appendChild(div);
            indiceActual++;
            while (container.children.length > 5) {
                container.removeChild(container.firstChild);
            }
        }

        btn.addEventListener('click', function() {
            mostrarFrase();
            if (navigator.vibrate) navigator.vibrate(20);
            const textos = ['💫 Otra más', '✨ Sigue', '💖 Una más', '🌟 Otra frase', '💕 Sigue sonriendo'];
            btn.textContent = textos[Math.floor(Math.random() * textos.length)];
        });

        setTimeout(mostrarFrase, 500);
    </script>
</body>
</html>
